[project]
name = "fabric-cdc-silver"
version = "0.1.0"
description = "CDC change logs -> clean silver tables in Microsoft Fabric, with schema contracts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Gustav Kruse" }]
keywords = ["microsoft-fabric", "cdc", "mirroring", "sap", "datasphere", "pyspark"]

[project.optional-dependencies]
test = ["pytest", "pyspark>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fabric_cdc_silver*"]
